<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Leave Application</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .leave-form-container {
      background-color: #fff;
      padding: 30px;
      width: 100%;
      max-width: 600px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #007BFF;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: #333;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #007BFF;
      color: white;
      border: none;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #0056b3;
    }

    @media (max-width: 600px) {
      .leave-form-container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="leave-form-container">
    <h2>Leave Application Form</h2>

    <form action="Home.html">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Your Name" required>

      <label for="roll">Roll Number</label>
      <input type="text" id="roll" name="roll" placeholder="Enter Roll No." required>

      <label for="from-date">From Date</label>
      <input type="inpit" id="from-date" name="from_date" placeholder="DD-MM-YYYY" required>

      <label for="to-date">To Date</label>
      <input type="input" id="to-date" name="to_date" placeholder="DD-MM-YYYY" required>

      <label for="reason">Reason for Leave</label>
      <textarea id="reason" name="reason" placeholder="Enter reason for leave..." required></textarea>

      <label for="leave-type">Type of Leave</label>
      <input type="text" id="leave-type" name="leave_type" placeholder="e.g., Sick Leave, Emergency Leave" required>

      <button type="submit">Submit Application</button>
    </form>
  </div>

</body>
</html>
