<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Class Timetable</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-image:("background.jpeg") ;
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      min-height: 100vh;
    }
    h1 {
      margin-top: 20px;
      margin-bottom: 20px;
      color: #333;
      text-align: center;
    }
    .timetable-container {
      max-width: 1000px;
      width: 90%;
      border: 10px solid #2d353d;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      background-color: #fff;
      padding: 15px;
    }
    .timetable-container img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 5px;
    }
    @media (max-width: 600px) {
      h1 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <h1>Weekly Class Timetable</h1>
  <div class="timetable-container">
    <img src="time-table.jpg" alt="Class Timetable" />
  </div>
</body>
</html>
